<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0"/>
<title>Somalia Threat Map</title>
<link rel="stylesheet" href="leaflet.css"/>
<script src="leaflet.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#0A0E1A; font-family:sans-serif; }
  #map { width:100%; height:100%; background:#0A0E1A; }
  .legend {
    background:rgba(10,14,26,0.95);
    color:#E0E0E0; padding:10px 12px; border-radius:10px;
    font-size:12px; border:1px solid #2A3A4A; line-height:1.6;
  }
  .legend h4 { color:#4FC3F7; margin-bottom:6px; font-size:13px; font-weight:700; }
  .legend-item { display:flex; align-items:center; gap:7px; margin:3px 0; }
  .dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .leaflet-popup-content-wrapper {
    background:#0D1520 !important; color:#E0E0E0 !important;
    border:1px solid #2A3A4A !important; border-radius:8px !important;
    box-shadow:0 4px 20px rgba(0,0,0,0.6) !important;
  }
  .leaflet-popup-tip { background:#0D1520 !important; }
  .leaflet-control-zoom a {
    background:#131929 !important; color:#4FC3F7 !important;
    border-color:#2A3A4A !important; font-size:16px !important;
  }
  .leaflet-control-zoom a:hover { background:#1E2D3D !important; }
  /* hide attribution */
  .leaflet-control-attribution { display:none; }
</style>
</head>
<body>
<div id="map"></div>
<script>
// Offline-first: no tile server — dark solid background via CSS
const map = L.map('map', {
  center: [5.5, 46.0], zoom: 5,
  zoomControl: true, attributionControl: false,
});

// Blank dark tile so Leaflet grid still works but no CDN needed
L.tileLayer('', { maxZoom: 19 }).addTo(map);

// ── Grid lines to give spatial context ─────────────────────────────────────
// Light graticule lines every 2° between Somalia bounds
for (let lat = -2; lat <= 12; lat += 2) {
  L.polyline([[lat, 40], [lat, 52]], { color:'#1E2D3D', weight:1, opacity:0.6 }).addTo(map);
}
for (let lng = 40; lng <= 52; lng += 2) {
  L.polyline([[-2, lng], [12, lng]], { color:'#1E2D3D', weight:1, opacity:0.6 }).addTo(map);
}

// ── Somalia rough coastline outline (simplified polygon) ─────────────────────
const somaliaOutline = [
  [11.5,51.3],[11.2,51.0],[10.8,50.0],[10.3,49.2],[10.0,48.5],
  [9.5,47.8],[9.0,47.5],[8.5,47.2],[8.0,46.8],[7.5,46.5],
  [7.0,46.2],[6.5,46.0],[6.0,45.5],[5.5,45.0],[5.0,44.5],
  [4.5,44.0],[4.0,43.5],[3.5,43.0],[3.0,42.5],[2.5,42.0],
  [2.0,41.5],[1.5,41.2],[1.0,41.4],[0.5,41.7],[0.0,42.0],
  [-0.5,42.2],[-1.0,41.8],[-1.5,41.0],[-1.0,40.5],[0.0,40.5],
  [1.0,41.0],[1.5,41.2],[2.0,41.5],[2.5,42.0],[3.0,42.5],
  [3.7,42.2],[4.2,42.5],[4.5,42.8],[5.0,43.5],[5.5,43.8],
  [6.0,44.2],[6.5,44.5],[7.0,45.0],[7.5,45.5],[8.0,46.0],
  [8.5,46.5],[9.0,47.0],[9.5,47.5],[10.0,48.0],[10.5,48.8],
  [11.0,49.5],[11.3,50.2],[11.5,50.8],[11.5,51.3],
];
L.polygon(somaliaOutline, {
  color:'#2A3A4A', weight:1.5, fillColor:'#0D1825', fillOpacity:0.8,
}).addTo(map);

// ── Threat zones ──────────────────────────────────────────────────────────────
const riskColor  = { high:'#EF5350', medium:'#FFB300', low:'#66BB6A' };
const riskRadius = { high:80000, medium:65000, low:55000 };

const regions = [
  { name:'Banaadir (Mogadishu)', lat:2.05,  lng:45.34, risk:'high',   pop:'2.4M', note:'Capital — IED & VBIED attacks, AS targeting' },
  { name:'Lower Shabelle',       lat:1.80,  lng:44.50, risk:'high',   pop:'1.2M', note:'AS stronghold; SNA operations ongoing' },
  { name:'Middle Shabelle',      lat:3.30,  lng:45.60, risk:'high',   pop:'0.7M', note:'Active conflict zone; contested routes' },
  { name:'Gedo',                 lat:3.50,  lng:42.20, risk:'high',   pop:'0.5M', note:'Cross-border militant activity' },
  { name:'Bay (Baidoa)',         lat:3.12,  lng:43.65, risk:'high',   pop:'0.9M', note:'AS presence; humanitarian crisis' },
  { name:'Lower Juba (Kismayo)',lat:0.40,  lng:42.00, risk:'high',   pop:'0.4M', note:'Strategic port; AS tax collection' },
  { name:'Bakool',               lat:4.10,  lng:43.80, risk:'high',   pop:'0.4M', note:'Rural AS control' },
  { name:'Hiraan (Beledweyne)', lat:4.74,  lng:45.20, risk:'medium', pop:'0.6M', note:'Clan conflict; AS presence' },
  { name:'Galgaduud',            lat:5.60,  lng:46.80, risk:'medium', pop:'0.5M', note:'Active clan disputes' },
  { name:'Mudug (Galcaio)',      lat:6.80,  lng:47.80, risk:'medium', pop:'0.6M', note:'Puntland-Galmudug boundary tension' },
  { name:'Sool',                 lat:8.70,  lng:47.40, risk:'medium', pop:'0.2M', note:'Disputed SSC-Khaatumo vs Somaliland' },
  { name:'Sanaag',               lat:10.70, lng:47.40, risk:'medium', pop:'0.3M', note:'Disputed Somaliland/Puntland' },
  { name:'Nugaal',               lat:8.20,  lng:49.20, risk:'low',    pop:'0.3M', note:'Puntland interior — relatively stable' },
  { name:'Bari (Bosaso)',        lat:11.28, lng:49.18, risk:'low',    pop:'0.6M', note:'Bosaso — Puntland commercial hub' },
  { name:'Woqooyi Galbeed',     lat:9.56,  lng:44.06, risk:'low',    pop:'1.0M', note:'Hargeisa — Somaliland, stable governance' },
  { name:'Togdheer',             lat:9.80,  lng:45.50, risk:'low',    pop:'0.4M', note:'Somaliland interior — peaceful' },
];

regions.forEach(r => {
  const c = riskColor[r.risk];
  L.circle([r.lat, r.lng], {
    color: c, fillColor: c, fillOpacity: 0.2, weight: 1.5,
    radius: riskRadius[r.risk],
  }).addTo(map).bindPopup(`
    <div style="min-width:170px">
      <b style="color:#4FC3F7;font-size:13px">${r.name}</b><br/>
      <span style="color:${c};font-weight:700">● ${r.risk.toUpperCase()} RISK</span><br/>
      <span style="color:#8899AA;font-size:11px">Population: ${r.pop}</span><br/>
      <span style="font-size:11px">${r.note}</span>
    </div>
  `);
  // Region label
  L.marker([r.lat, r.lng], {
    icon: L.divIcon({
      html: `<div style="color:${c};font-size:9px;font-weight:700;text-shadow:0 0 4px #000;white-space:nowrap">${r.name.split('(')[0].trim()}</div>`,
      iconSize:[100,14], iconAnchor:[50,7], className:'',
    }), interactive: false,
  }).addTo(map);
});

// ── Key cities ────────────────────────────────────────────────────────────────
const cities = [
  { name:'Mogadishu',  lat:2.05,  lng:45.34, icon:'🏛️', type:'Federal Capital' },
  { name:'Kismayo',    lat:0.36,  lng:42.55, icon:'⚓', type:'Jubbaland Capital' },
  { name:'Baidoa',     lat:3.12,  lng:43.65, icon:'🏙️', type:'SWS Capital' },
  { name:'Bosaso',     lat:11.28, lng:49.18, icon:'⚓', type:'Puntland Port' },
  { name:'Hargeisa',   lat:9.56,  lng:44.06, icon:'🏙️', type:'Somaliland Capital' },
  { name:'Beledweyne', lat:4.74,  lng:45.20, icon:'🏙️', type:'Hirshabelle Capital' },
  { name:'Garowe',     lat:8.41,  lng:48.48, icon:'🏙️', type:'Puntland Capital' },
  { name:'Galcaio',    lat:6.77,  lng:47.43, icon:'🏙️', type:'Galmudug Hub' },
];

cities.forEach(c => {
  L.marker([c.lat, c.lng], {
    icon: L.divIcon({
      html: `<div style="font-size:18px;text-shadow:0 0 6px #000">${c.icon}</div>`,
      iconSize:[22,22], iconAnchor:[11,11], className:'',
    })
  }).addTo(map).bindPopup(`
    <b style="color:#4FC3F7">${c.name}</b><br/>
    <span style="color:#8899AA;font-size:11px">${c.type}</span>
  `);
});

// ── Legend ────────────────────────────────────────────────────────────────────
const legend = L.control({ position:'bottomleft' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <h4>🇸🇴 Threat Levels</h4>
    <div class="legend-item"><div class="dot" style="background:#EF5350"></div>High Risk</div>
    <div class="legend-item"><div class="dot" style="background:#FFB300"></div>Medium Risk</div>
    <div class="legend-item"><div class="dot" style="background:#66BB6A"></div>Low Risk</div>
    <div style="margin-top:6px;border-top:1px solid #2A3A4A;padding-top:5px;font-size:10px;color:#8899AA">
      Tap a zone for details
    </div>
  `;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
