<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=3.0"/>
<title>Somalia Map</title>
<link rel="stylesheet" href="leaflet.css"/>
<script src="leaflet.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#0A0E1A; font-family:sans-serif; }
  #map { width:100%; height:100%; }
  .legend {
    background:rgba(10,14,26,0.92);
    color:#E0E0E0;
    padding:10px 12px;
    border-radius:10px;
    font-size:12px;
    border:1px solid #2A3A4A;
    line-height:1.5;
  }
  .legend h4 { color:#4FC3F7; margin-bottom:6px; font-size:13px; font-weight:700; }
  .legend-item { display:flex; align-items:center; gap:7px; margin:3px 0; }
  .dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .leaflet-popup-content-wrapper {
    background:#0D1520 !important;
    color:#E0E0E0 !important;
    border:1px solid #2A3A4A !important;
    border-radius:8px !important;
    box-shadow:0 4px 20px rgba(0,0,0,0.5) !important;
  }
  .leaflet-popup-tip { background:#0D1520 !important; }
  .leaflet-control-zoom a { background:#0D1520 !important; color:#4FC3F7 !important; border-color:#2A3A4A !important; }
  .leaflet-control-zoom a:hover { background:#131929 !important; }
</style>
</head>
<body>
<div id="map"></div>
<script>
// Fix Leaflet image path for bundled assets
L.Icon.Default.imagePath = 'images/';
L.Icon.Default.mergeOptions({
  iconUrl: 'images/marker-icon.png',
  iconRetinaUrl: 'images/marker-icon-2x.png',
  shadowUrl: 'images/marker-shadow.png',
});

const map = L.map('map', {
  center: [5.5, 46.0],
  zoom: 5,
  zoomControl: true,
  attributionControl: false,
});

// CartoDB Dark (HTTPS — works from file:// with allowUniversalAccessFromFileURLs)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

const riskColor  = { high:'#EF5350', medium:'#FFB300', low:'#66BB6A' };
const riskRadius = { high:28000, medium:22000, low:16000 };

const regions = [
  { name:'Banaadir (Mogadishu)', lat:2.05,  lng:45.34, risk:'high',   pop:'2.4M', note:'Capital — frequent IED & VBIED attacks, Al-Shabaab targeting' },
  { name:'Lower Shabelle',       lat:1.80,  lng:44.50, risk:'high',   pop:'1.2M', note:'Al-Shabaab stronghold; SNA operations ongoing' },
  { name:'Middle Shabelle',      lat:3.30,  lng:45.60, risk:'high',   pop:'0.7M', note:'Active conflict zone; supply routes contested' },
  { name:'Gedo',                 lat:3.50,  lng:42.20, risk:'high',   pop:'0.5M', note:'Cross-border militant activity (Ethiopian/Kenyan border)' },
  { name:'Bay (Baidoa)',         lat:3.12,  lng:43.65, risk:'high',   pop:'0.9M', note:'Al-Shabaab presence; humanitarian crisis' },
  { name:'Lower Juba (Kismayo)',lat:0.40,  lng:42.00, risk:'high',   pop:'0.4M', note:'Kismayo — strategic port; AS tax collection routes' },
  { name:'Bakool',               lat:4.10,  lng:43.80, risk:'high',   pop:'0.4M', note:'Rural AS control; limited government reach' },
  { name:'Hiraan (Beledweyne)', lat:4.74,  lng:45.20, risk:'medium', pop:'0.6M', note:'Clan conflict; AS presence; Hirshabelle instability' },
  { name:'Galgaduud',            lat:5.60,  lng:46.80, risk:'medium', pop:'0.5M', note:'Active clan disputes; Galmudug state tensions' },
  { name:'Mudug (Galcaio)',      lat:6.80,  lng:47.80, risk:'medium', pop:'0.6M', note:'Puntland–Galmudug boundary disputes' },
  { name:'Nugaal',               lat:8.20,  lng:49.20, risk:'low',    pop:'0.3M', note:'Puntland interior — relatively stable' },
  { name:'Bari (Bosaso)',        lat:11.28, lng:49.18, risk:'low',    pop:'0.6M', note:'Bosaso — Puntland commercial hub' },
  { name:'Woqooyi Galbeed',     lat:9.56,  lng:44.06, risk:'low',    pop:'1.0M', note:'Hargeisa — Somaliland capital, stable governance' },
  { name:'Togdheer',             lat:9.80,  lng:45.50, risk:'low',    pop:'0.4M', note:'Somaliland — peaceful interior' },
  { name:'Sanaag',               lat:10.70, lng:47.40, risk:'medium', pop:'0.3M', note:'Disputed Somaliland/Puntland — periodic clashes' },
  { name:'Sool',                 lat:8.70,  lng:47.40, risk:'medium', pop:'0.2M', note:'Disputed territory — SSC-Khaatumo vs Somaliland' },
];

regions.forEach(r => {
  const color = riskColor[r.risk];
  L.circle([r.lat, r.lng], {
    color, fillColor: color, fillOpacity: 0.22, weight: 1.5,
    radius: riskRadius[r.risk],
  }).addTo(map).bindPopup(`
    <div style="min-width:180px">
      <b style="color:#4FC3F7;font-size:13px">${r.name}</b><br/>
      <span style="color:${color};font-weight:700">● ${r.risk.toUpperCase()} RISK</span><br/>
      <span style="color:#8899AA;font-size:11px">Population: ${r.pop}</span><br/>
      <span style="font-size:11px">${r.note}</span>
    </div>
  `);
});

const cities = [
  { name:'Mogadishu', lat:2.05,  lng:45.34, icon:'🏛️', type:'Federal Capital' },
  { name:'Kismayo',   lat:0.36,  lng:42.55, icon:'⚓', type:'Jubbaland Capital' },
  { name:'Baidoa',    lat:3.12,  lng:43.65, icon:'🏙️', type:'SWS Capital' },
  { name:'Bosaso',    lat:11.28, lng:49.18, icon:'⚓', type:'Puntland Port' },
  { name:'Hargeisa',  lat:9.56,  lng:44.06, icon:'🏙️', type:'Somaliland Capital' },
  { name:'Beledweyne',lat:4.74,  lng:45.20, icon:'🏙️', type:'Hirshabelle Capital' },
  { name:'Garowe',    lat:8.41,  lng:48.48, icon:'🏙️', type:'Puntland Capital' },
  { name:'Galcaio',   lat:6.77,  lng:47.43, icon:'🏙️', type:'Galmudug Hub' },
  { name:'Burco',     lat:9.52,  lng:45.53, icon:'🏙️', type:'Somaliland City' },
];

cities.forEach(c => {
  L.marker([c.lat, c.lng], {
    icon: L.divIcon({
      html: `<div style="font-size:20px;filter:drop-shadow(0 0 4px #000)">${c.icon}</div>`,
      iconSize:[24,24], iconAnchor:[12,12], className:'',
    })
  }).addTo(map).bindPopup(`
    <b style="color:#4FC3F7">${c.name}</b><br/>
    <span style="color:#8899AA;font-size:11px">${c.type}</span>
  `);
});

// ── Active operations marker ───────────────────────────────────────────────
const ops = [
  { lat:2.30, lng:44.80, label:'SNA Operation Badbaado', color:'#4FC3F7' },
  { lat:3.60, lng:43.20, label:'AUSSOM Patrol Zone', color:'#66BB6A' },
];
ops.forEach(o => {
  L.circleMarker([o.lat, o.lng], {
    color: o.color, fillColor: o.color, fillOpacity: 0.7, radius: 8, weight: 2,
  }).addTo(map).bindPopup(`<b style="color:${o.color}">${o.label}</b>`);
});

const legend = L.control({ position:'bottomleft' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div','legend');
  div.innerHTML = `
    <h4>🇸🇴 Threat Assessment</h4>
    <div class="legend-item"><div class="dot" style="background:#EF5350"></div> High Risk</div>
    <div class="legend-item"><div class="dot" style="background:#FFB300"></div> Medium Risk</div>
    <div class="legend-item"><div class="dot" style="background:#66BB6A"></div> Low Risk</div>
    <div style="margin-top:6px;border-top:1px solid #2A3A4A;padding-top:6px">
      <div class="legend-item"><div class="dot" style="background:#4FC3F7"></div> Active Op</div>
    </div>
  `;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
