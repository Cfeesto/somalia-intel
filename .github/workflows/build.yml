name: Build Somalia Intel APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build release APK
        run: gradle assembleRelease
        env:
          JAVA_OPTS: "-Xmx4g"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: somalia-intel-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Somalia Intel v${{ github.run_number }}"
          body: |
            🇸🇴 Somalia Intelligence Monitor

            **Features:**
            - Live news from Dalsan TV, Dawan TV, Garowe Online, Shabelle, VOA
            - Journalist feeds: Harun Maruf, Abdirizak Atosh, Mohamed Salh, Bakayle, Ali Aadan Muumin, Idiris Alteeso
            - Article images with Coil, offline Room DB cache
            - Source filter chips + full-text search
            - Interactive Somalia threat map (color-coded by risk zone)
            - AI Intelligence Brief (Claude API or local fallback)
            - Background refresh every 15 minutes via WorkManager
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
